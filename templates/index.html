<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Earthdata 10m Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 24px; border-radius: 12px; max-width: 650px; margin: 0 auto; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 14px; color: #94a3b8; }
        input { padding: 10px; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
        button { background: #2563eb; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #1d4ed8; }
        .image-container { margin-top: 20px; text-align: center; }
        img { max-width: 100%; border-radius: 8px; border: 1px solid #475569; }
        .error { color: #f87171; margin-top: 15px; }
        .card {
    max-width: 850px; /* Expand card width to accommodate wider image */
}

img {
    width: 100%;
    max-width: 700px; /* Scale up image display area */
    border-radius: 8px;
    border: 1px solid #475569;
}
    </style>
</head>
<body>
    <div class="card">
        <h2>NASA Earthdata 10m Satellite Viewer</h2>
        <form method="POST">
            <div class="form-group">
                <label>Latitude:</label>
                <input type="text" name="lat" value="{{ lat or '37.7749' }}" required>
            </div>
            <div class="form-group">
                <label>Longitude:</label>
                <input type="text" name="lon" value="{{ lon or '-122.4194' }}" required>
            </div>
            <button type="submit">Fetch 10m Scene</button>
        </form>

{% if image_data %}
    <div class="image-container">
        <h3>Satellite Snapshot (Date: {{ observation }})</h3>
        <img src="{{ image_data }}" alt="Satellite Scene">
    </div>
{% elif error_message %}
    <p style="color: #f87171;">Error: {{ error_message }}</p>
{% endif %}
    </div>
</body>
</html>
