<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Geospatial Satellite Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; overflow: hidden; }
        
        .control-panel {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(10px);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 300px;
            transition: all 0.3s ease;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 { font-size: 1rem; color: #38bdf8; }
        
        .toggle-btn {
            display: none;
            background: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            width: auto;
        }

        .form-group { margin-top: 10px; }
        .form-group label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; }
        
        .info-tip {
            font-size: 0.7rem;
            color: #38bdf8;
            margin-top: 6px;
            line-height: 1.3;
        }

        input, select, button {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #f8fafc;
            font-size: 0.85rem;
            outline: none;
        }

        .button-group { margin-top: 10px; }

        button.primary { background: #0284c7; border: none; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button.primary:hover { background: #0369a1; }
        button.secondary { background: #334155; border: none; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button.secondary:hover { background: #475569; }

        #webgl-container { width: 100vw; height: 100vh; display: block; }
        
        .help-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.8);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-size: 0.75rem;
            color: #94a3b8;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .control-panel {
                top: 10px;
                left: 10px;
                right: 10px;
                width: auto;
                padding: 10px 14px;
            }

            .toggle-btn { display: block; }

            .control-panel.collapsed .panel-body {
                display: none;
            }

            .help-overlay { display: none; }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="control-panel" id="panel">
        <div class="panel-header">
            <h2>3D Geospatial Viewer</h2>
            <button type="button" class="toggle-btn" id="toggle-panel-btn">Hide controls</button>
        </div>

        <div class="panel-body">
            <div class="form-group">
                <label for="presets">Quick Presets</label>
                <select id="presets">
                    <option value="">-- Select Landmark --</option>
                    <option value="9.9195,78.1190">Meenakshi Temple, Madurai</option>
                    <option value="13.0628,80.2796">Chepauk Stadium, Chennai</option>
                    <option value="28.6139,77.2090">Delhi (Connaught Place)</option>
                    <option value="19.0760,72.8777">Mumbai (Gateway of India)</option>
                    <option value="-33.8568,151.2153">Sydney Opera House, Australia</option>
                </select>
            </div>

            <form method="POST" id="geo-form">
                <div class="form-group">
                    <label for="latitude">Latitude</label>
                    <input type="text" id="latitude" name="latitude" placeholder="e.g. 9.9195" required value="{% if data and data.latitude %}{{ data.latitude }}{% endif %}">
                </div>
                <div class="form-group">
                    <label for="longitude">Longitude</label>
                    <input type="text" id="longitude" name="longitude" placeholder="e.g. 78.1190" required value="{% if data and data.longitude %}{{ data.longitude }}{% endif %}">
                </div>
                
                <p class="info-tip">💡 Tip: Enter the custom Lat & Lon of any city globally to explore it in 3D.</p>

                <div class="form-group">
                    <button type="submit" class="primary">Fetch & Render 3D</button>
                </div>
            </form>

            <div class="button-group">
                <button type="button" class="secondary" id="reset-cam-btn">Reset View</button>
            </div>
        </div>
    </div>

    <div class="help-overlay">
        🖱️ Left Click + Drag: Rotate | Right Click + Drag: Pan | Scroll: Zoom
    </div>

    <div id="image-data-store" data-image="{% if data and data.image %}{{ data.image }}{% endif %}"></div>

    <div id="webgl-container"></div>

    <script>
        const panel = document.getElementById('panel');
        const toggleBtn = document.getElementById('toggle-panel-btn');

        toggleBtn.addEventListener('click', () => {
            panel.classList.toggle('collapsed');
            toggleBtn.innerText = panel.classList.contains('collapsed') ? 'Show controls' : 'Hide controls';
        });

        document.getElementById('presets').addEventListener('change', function(e) {
            if (e.target.value) {
                const parts = e.target.value.split(',');
                document.getElementById('latitude').value = parts[0];
                document.getElementById('longitude').value = parts[1];
                document.getElementById('geo-form').submit();
            }
        });

        const dataStore = document.getElementById('image-data-store');
        const imageData = dataStore ? dataStore.dataset.image : '';

        if (imageData) {
            if (window.innerWidth <= 600) {
                panel.classList.add('collapsed');
                toggleBtn.innerText = 'Show controls';
            }

            const container = document.getElementById('webgl-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 8);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const textureLoader = new THREE.TextureLoader();
            const texture = textureLoader.load(imageData);
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

            const geometry = new THREE.PlaneGeometry(10, 10);
            const material = new THREE.MeshStandardMaterial({ 
                map: texture, 
                side: THREE.DoubleSide 
            });
            const plane = new THREE.Mesh(geometry, material);
            plane.rotation.x = -Math.PI / 2;
            scene.add(plane);

            const animate = function() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            };
            animate();

            document.getElementById('reset-cam-btn').addEventListener('click', function() {
                camera.position.set(0, 8, 8);
                controls.reset();
            });

            window.addEventListener('resize', function() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
